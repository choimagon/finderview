<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';"
    />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>FinderView</title>
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <svg
          class="brand-mark"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 7.1 21.3 5.8Q23 5.2 23 7v10Q23 18.7 21.4 18.1L18 16.9" />
          <path d="m12 5.5 4.2-1.6Q18 3.2 18 5.2v13.5q0 2-1.8 1.4L12 18.7" />
          <path
            d="M2.5 5.6 9.8 2.3Q12 1.3 12 3.7v16.6q0 2.5-2.2 1.7l-7.3-2.5Q1 19 1 17.5V7.7q0-1.4 1.5-2.1Z"
          /></svg
        ><strong>FinderView</strong>
      </div>
      <div class="actions">
        <select id="roots" aria-label="워크스페이스 선택"></select>
        <span
          class="drop-help"
          title="외부 파일은 Shift를 누른 채 원하는 폴더 위에 놓으면 복사됩니다."
          >외부 파일은 <kbd>Shift</kbd> + 드래그</span
        >
        <span id="selection-count" role="status" aria-live="polite"></span>
        <button
          id="refresh"
          title="새로고침 (Ctrl/Cmd+R)"
          aria-label="새로고침"
        >
          ↻ <span>새로고침</span>
        </button>
        <label class="toggle"
          ><input id="hidden" type="checkbox" /> 점(.) 파일</label
        >
        <select id="sort" aria-label="정렬">
          <option value="folders">폴더 우선 · 이름순</option>
          <option value="name">이름순</option>
          <option value="modified">최근 수정순</option>
        </select>
      </div>
    </header>
    <div class="pathbar">
      <span id="breadcrumb">워크스페이스</span
      ><span id="activity" role="status" aria-live="polite"></span>
    </div>
    <div id="error" role="alert" hidden></div>
    <main id="columns" aria-label="열 탐색기" aria-busy="false"></main>
    <footer id="metadata" aria-live="polite">
      <span class="hint">폴더를 선택해 탐색하세요</span
      ><span class="key-hint"
        >드래그로 이동 · ⌘/Ctrl·Shift 다중 선택 · Delete 휴지통</span
      >
    </footer>
    <div id="context" role="menu" aria-label="파일 작업" hidden>
      <button role="menuitem" data-action="open">VS Code에서 열기</button>
      <button role="menuitem" data-action="external">외부 앱으로 열기</button>
      <button role="menuitem" data-action="reveal">
        Finder / 파일 탐색기에서 열기
      </button>
      <button role="menuitem" data-action="copy">경로 복사</button>
      <hr />
      <button role="menuitem" data-action="add">파일 추가…</button>
      <button role="menuitem" data-action="move">이동…</button>
      <button role="menuitem" data-action="rename">이름 변경…</button>
      <button
        role="menuitem"
        data-action="trash"
        class="danger"
        title="확인 후 휴지통으로 이동"
      >
        삭제…
      </button>
    </div>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
